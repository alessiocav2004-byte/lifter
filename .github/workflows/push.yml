
name: Push

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check upstream updates
        id: check
        if: github.event_name == 'schedule'
        run: |
          git remote add upstream https://github.com/joojoooo/DubLift.git
          git fetch upstream main

          if git merge-base HEAD upstream/main >/dev/null 2>&1; then
            if git merge-base --is-ancestor upstream/main HEAD; then
              echo "updated=false" >> "$GITHUB_OUTPUT"
            else
              echo "updated=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch upstream for manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          git remote add upstream https://github.com/joojoooo/DubLift.git
          git fetch upstream main

      - name: Sync upstream
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.updated == 'true'
        run: |
          git merge --no-edit --allow-unrelated-histories upstream/main

      - name: Push changes
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.updated == 'true'
        run: git push origin HEAD:main
